name: Public installer downloads

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-public-installer.mjs'
      - '.github/workflows/public-installer-verification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-public-installer.mjs'
      - '.github/workflows/public-installer-verification.yml'

permissions:
  contents: read

jobs:
  public-downloads:
    name: Anonymous off-LAN signed package verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download and verify all public assets without authentication
        run: node scripts/verify-public-installer.mjs
