<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonuvi Configuration</title>
  <script src="/__controller/config.js"></script>
  <script src="scripts/controller-browser-auth.js"></script>
  <style>
    :root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:var(--theme-bg,#0c1526);--card:var(--theme-hero-card-bg,rgba(10,18,34,.45));--line:var(--theme-rail-border,#2a3a58);--soft:var(--theme-card-secondary-fill,#0f1a31);--text:var(--theme-text,#e7eefc);--muted:var(--theme-text-secondary,#9fb1d9);--control-bg:var(--theme-tab-bg,#0f1a31);--control-text:var(--theme-tab-text,#e7eefc);--active-bg:var(--theme-tab-active-bg,#3357d6);--active-text:var(--theme-tab-active-text,#fff);--hover-bg:var(--theme-tab-hover-bg,#2f4f93);--accent:var(--control-text)}
    *{box-sizing:border-box}body{margin:0 auto;max-width:1220px;padding:36px 34px;background:var(--bg);color:var(--text)}
    h1{font-size:34px;letter-spacing:-1px;font-weight:620;margin:10px 0}h2{font-size:18px;letter-spacing:-.3px}p{line-height:1.6;color:var(--muted)}
    .eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);font-weight:650}.intro{margin-bottom:26px}.intro p{margin:0}
    button,input,select,textarea{font:inherit;color:var(--control-text)}button,input:not([type=checkbox]),select,textarea{background:var(--control-bg);border:1px solid var(--line);border-radius:7px;padding:10px 13px;max-width:100%}
    button{cursor:pointer}button:hover{border-color:var(--line);background:var(--hover-bg);color:var(--control-text)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--active-bg);outline-offset:3px}input[type=checkbox]{accent-color:var(--active-bg);width:18px;height:18px}a{color:var(--accent)}
    input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
    .collection-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}.collection-filters{display:flex;flex-wrap:wrap;gap:6px}.collection-filters button{background:transparent;border-color:transparent;color:var(--muted)}.collection-filters button[aria-pressed=true]{color:var(--active-text);background:var(--active-bg);border-color:var(--line)}.collection-search{margin-left:auto;width:240px;min-width:0;flex:1 1 220px}.collection-add{margin-left:auto}
    .plugin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
    .plugin-card{min-width:0;margin:0;padding:24px;border:1px solid var(--line);border-radius:13px;background:var(--card);display:flex;flex-direction:column}
    .card-header{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:39px}
    .card-icon{display:grid;place-items:center;flex:0 0 39px;width:39px;height:39px;border-radius:11px;background:var(--soft);color:var(--accent);font-size:22px;line-height:1}
    .card-badge{min-width:0;max-width:calc(100% - 53px);font-size:11px;line-height:1.4;padding:5px 9px;border-radius:6px;background:var(--soft);color:var(--accent);overflow-wrap:anywhere;text-align:center}
    .plugin-card>.card-title{margin:18px 0 9px;font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.3px;overflow-wrap:anywhere}
    .card-description{font-size:13px;margin:0 0 23px;line-height:1.6;overflow-wrap:anywhere}
    .card-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:17px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;color:var(--muted);font-size:12px}
    .card-footer button{color:var(--accent);border:0;background:transparent;padding:8px 0;min-height:36px}
    .card-body{min-width:0;border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:13px;overflow-wrap:anywhere}
    .plugin-card.expanded{grid-column:1/-1}
    .card-body small{color:var(--muted)}
    .card-body details{min-width:0;border-top:1px solid var(--line);padding:13px 0}
    .card-body summary{cursor:pointer;font-weight:600;padding:7px 0}
    .card-body label{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:center;gap:8px 16px;max-width:780px;margin:12px 0;overflow-wrap:anywhere}
    .card-body label>span{grid-column:2}
    .card-body label input:not([type=checkbox]),.card-body label select,.card-body label textarea{width:100%;min-width:0}
    .card-body input[type=checkbox]{justify-self:start;margin:0}
    .card-body textarea{width:100%;font:13px ui-monospace,monospace;min-height:88px}
    .card-body label+br{display:none}
    .card-body button{margin:6px 10px 6px 0;white-space:normal;overflow-wrap:anywhere}
    .card-body fieldset{min-width:0;border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:14px}
    .card-body fieldset legend{max-width:100%;padding:0 5px;font-size:14px;line-height:1.4;margin:0;overflow-wrap:anywhere}
    [hidden]{display:none!important}.configuration-status{white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere}.collection-empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}.optional-integrations,.advanced-settings{margin-top:24px;border:1px solid var(--line);border-radius:12px;padding:18px 22px;background:var(--card)}summary{cursor:pointer}.optional-integrations button{margin:12px 10px 0 0}.advanced-settings textarea{width:100%;margin-top:14px;font:13px ui-monospace,monospace}.configuration-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding:18px 0;border-top:1px solid var(--line)}.configuration-actions .primary{background:var(--active-bg);color:var(--active-text);font-weight:600;border-color:var(--line)}.configuration-actions button:last-child{margin-left:auto}
    @media(max-width:1050px){.plugin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:26px 22px}.collection-search{margin-left:0;flex:1}}
    @media(max-width:560px){body{padding:22px 16px}.plugin-grid{grid-template-columns:1fr}h1{font-size:28px}.collection-search{width:100%}.collection-filters{gap:2px}.collection-filters button{padding:10px}.card-body label{grid-template-columns:minmax(0,1fr);align-items:start;gap:7px}.card-body label>span{grid-column:1}.card-body label input:not([type=checkbox]),.card-body label select,.card-body label textarea{width:100%}.configuration-actions button:last-child{margin-left:0}}
  </style>
</head>
<body>
  <header class="intro"><div class="eyebrow">Your listening ecosystem</div><h1>Everything, in harmony.</h1><p>Your music services, devices, and finishing touches. All in one place.</p></header>
  <main id="configuration"><p role="status">Loading authoritative Server configuration…</p></main>
  <script>
// Presentation only: read the existing app theme without changing preferences.
(() => {
  const root = document.documentElement;
  const tokens = ['bg','text','text-secondary','rail-bg','rail-border','hero-card-bg',
    'card-secondary-fill','tab-bg','tab-text','tab-active-bg','tab-active-text','tab-hover-bg']
    .map(name => '--theme-' + name);
  const read = key => { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } };
  let parentDocument = null;
  try { if (parent !== window && parent.location.origin === location.origin) parentDocument = parent.document; } catch {}
  const sync = () => {
    let values, light;
    if (parentDocument) {
      const style = parent.getComputedStyle(parentDocument.documentElement);
      values = Object.fromEntries(tokens.map(key => [key, style.getPropertyValue(key).trim()]));
      light = parentDocument.body?.classList.contains('theme-light');
    } else {
      const app = read('nowplaying.clientSettings.v1')?.app || {};
      values = app.themeTokens && Object.keys(app.themeTokens).length ? app.themeTokens : read('nowplaying.themeTokens.v1') || {};
      let mode = app.themeMode;
      try { mode ||= localStorage.getItem('np-theme'); } catch {}
      light = mode === 'light';
    }
    for (const key of tokens) {
      const value = values?.[key];
      if (typeof value === 'string' && value.trim()) root.style.setProperty(key, value);
      else root.style.removeProperty(key);
    }
    root.style.colorScheme = light ? 'light' : 'dark';
    root.classList.toggle('theme-light', Boolean(light));
    document.body?.classList.toggle('theme-light', Boolean(light));
  };
  sync();
  const observer = parentDocument ? new MutationObserver(sync) : null;
  if (observer) {
    observer.observe(parentDocument.documentElement, {attributes:true, attributeFilter:['style','class']});
    if (parentDocument.body) observer.observe(parentDocument.body, {attributes:true, attributeFilter:['class']});
  }
  addEventListener('storage', sync);
  addEventListener('message', event => {
    if (parentDocument && event.source === parent && event.origin === location.origin && event.data?.type === 'np-theme-sync') sync();
  });
  addEventListener('pagehide', () => observer?.disconnect(), {once:true});
})();
  </script>
  <script type="module">
    import { mountMasterConfigurationEditor } from './scripts/master-configuration-editor.mjs?v=20261117-tokens';
    const root = document.getElementById('configuration');
    try {
      await globalThis.SonuviControllerAuth?.ready;
      await mountMasterConfigurationEditor(root, { request: async (method, suffix, body) => {
        const response = await fetch('/__controller/configuration' + suffix, {
          method, credentials: 'same-origin', cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          ...(body === undefined ? {} : { body: JSON.stringify(body) }),
        });
        const result = await response.json();
        if (!response.ok) {
          const details = result.errors?.map(item => typeof item === 'string' ? item : `${item.path || ''}: ${item.message || item.code || JSON.stringify(item)}`).join('\n');
          throw new Error(details || result.error || result.code || `Configuration request failed (${response.status})`);
        }
        return result;
      }});
    } catch (error) {
      root.replaceChildren();
      const message = document.createElement('p'); message.setAttribute('role','alert');
      message.textContent = `Configuration is unavailable: ${error.message}. No partial settings have been loaded. An administrator session and a migrated Server are required.`;
      root.append(message);
    }
  </script>
</body>
</html>
