<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonuvi Configuration</title>
  <script src="/__controller/config.js"></script>
  <script src="scripts/controller-browser-auth.js"></script>
  <style>
    :root { color-scheme: dark light; font: 16px system-ui; }
    body { max-width: 1100px; margin: auto; padding: 24px; }
    fieldset { margin: 20px 0; padding: 18px; border-radius: 12px; }
    legend { font-weight: bold; }
    label { display: inline-block; margin: 6px 0; }
    input, select, button { font: inherit; padding: 8px; }
    textarea { box-sizing: border-box; font: 14px ui-monospace, monospace; padding: 12px; }
    button { margin: 12px 12px 12px 0; cursor: pointer; }
    [role=status] { white-space: pre-wrap; }
    .plugin-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; align-items: start; }
    .plugin-card { margin: 0; min-width: 0; background: light-dark(#f3f4f6,#27282b); border: 1px solid #7775; }
    .plugin-card small { opacity: .65; }
    .plugin-card details { padding: 10px 0; border-top: 1px solid #7774; }
    .plugin-card summary { cursor: pointer; font-weight: 600; }
    .plugin-card input:not([type=checkbox]), .plugin-card select { max-width: 100%; box-sizing: border-box; }
    @media(max-width:700px) { .plugin-grid { grid-template-columns: 1fr; } body { padding: 14px; } }
  </style>
</head>
<body>
  <h1>Server Configuration</h1>
  <p>Plugin settings and master JSON edit the same draft. Changes are saved only when you press Save / Update.</p>
  <main id="configuration"><p role="status">Loading authoritative Server configuration…</p></main>
  <script type="module">
    import { mountMasterConfigurationEditor } from './scripts/master-configuration-editor.mjs';
    const root = document.getElementById('configuration');
    try {
      await globalThis.SonuviControllerAuth?.ready;
      await mountMasterConfigurationEditor(root, { request: async (method, suffix, body) => {
        const response = await fetch('/__controller/configuration' + suffix, {
          method, credentials: 'same-origin', cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          ...(body === undefined ? {} : { body: JSON.stringify(body) }),
        });
        const result = await response.json();
        if (!response.ok) {
          const details = result.errors?.map(item => typeof item === 'string' ? item : `${item.path || ''}: ${item.message || item.code || JSON.stringify(item)}`).join('\n');
          throw new Error(details || result.error || result.code || `Configuration request failed (${response.status})`);
        }
        return result;
      }});
    } catch (error) {
      root.replaceChildren();
      const message = document.createElement('p'); message.setAttribute('role','alert');
      message.textContent = `Configuration is unavailable: ${error.message}. No partial settings have been loaded. An administrator session and a migrated Server are required.`;
      root.append(message);
    }
  </script>
</body>
</html>
