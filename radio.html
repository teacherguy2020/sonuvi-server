<!doctype html>
<html lang="en">
<head>
  <script src="scripts/runtime-auth.js?v=20261024-h2"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script id="shell-redirect">
    (function(){
      try {
        const qs = new URLSearchParams(location.search || '');
        const standalone = qs.get('standalone') === '1';
        if (standalone) {
          document.documentElement.classList.add('standaloneMode');
          return;
        }
        if (window.top !== window.self) return;
        const file = String(location.pathname.split('/').pop() || 'radio.html');
        const app = new URL('app.html', location.href);
        app.searchParams.set('page', file);
        location.replace(app.toString());
      } catch (_) {}
    })();
  </script>
  <title>Radio</title>
  <link rel="stylesheet" href="styles/podcasts.css?v=20260223-heroresponsive2" />
  <link rel="stylesheet" href="styles/podcasts2.css?v=20260222-widepages2" />
  <style>
    html.standaloneMode .preHeroStatusWrap,
    html.standaloneMode .heroRail{display:none !important}
    body{background:#0c1526;color:#e7eefc;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{max-width:1080px;margin:0 auto;padding:34px 18px 18px}
    .wrap > .card:first-child{margin-top:28px !important}
    .card{background:#101c33;border:1px solid #2a3a58;border-radius:18px;padding:12px;margin:10px 0}
    .radioGrid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr .8fr .8fr;gap:10px}
    label{display:block;font-size:12px;color:#9fb1d9;margin-bottom:6px}
    input,select,button{padding:8px 10px;border-radius:8px;border:1px solid #334;background:#0a1222;color:#eef}
    .choiceLine{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .muted{color:#9fb1d9;font-size:12px}
    .mutedSm{color:#8ea3c6;font-size:12px}
    .btnPrimary{background:linear-gradient(90deg,#1d4ed8,#7c3aed);border-color:transparent;color:#fff;font-weight:650}
    .radioTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
    .radioTable th,.radioTable td{padding:8px;border-bottom:1px dashed #233650;text-align:left;vertical-align:middle}
    .radioTable th{color:#9fb2d1;font-weight:600}
    .logo{width:44px;height:44px;object-fit:cover;border-radius:10px;border:1px solid #2a3a58;background:#111}
    .heartBtn{border:0;background:transparent !important;cursor:pointer;font-size:17px;color:#7f8fae !important;padding:0}
    .heartBtn.on{color:#ef4444 !important}
    #themeToggle{min-width:44px;padding:8px 12px;font-size:16px;line-height:1}
    body.theme-light .muted{color:#2f2a4f}
    body.theme-light .mutedSm{color:#4b3e6f}
    body.theme-light label{color:#4b3e6f}
    body.theme-light input::placeholder{color:#6b5f90;opacity:1}
    body.theme-light .stationCluster{background:rgba(255,255,255,.68);border-color:rgba(137,138,196,.36)}
    body.theme-light .clusterTitle{color:#2f2a4f}
    body.theme-light .clusterCount{color:#4b3e6f}
    body.theme-light .stationCard{background:rgba(255,255,255,.78);border-color:rgba(137,138,196,.36)}
    body.theme-light .stationName{color:#1f1833}
    body.theme-light .stationMeta{color:#4b3e6f}
    body.theme-light .stationAction{background:#c0c9ee;color:#2f2a4f;border-color:rgba(137,138,196,.42)}
    body.theme-light .stationAction:hover{background:#d7def4;border-color:rgba(137,138,196,.56)}
    body.theme-light .chip{border-color:rgba(137,138,196,.46);color:#3b3260;background:rgba(255,255,255,.7)}

    body:not(.theme-light){background:#0c1526 !important;color:#e7eefc !important}
    body:not(.theme-light) .card{background:#101c33 !important;border-color:#2a3a58 !important}
    body:not(.theme-light) .stationCluster{background:rgba(7,16,33,.55) !important;border-color:#2a3a58 !important}
    body:not(.theme-light) .stationCard{background:#0a1222 !important;border-color:#2a3a58 !important}
    body:not(.theme-light) .stationName{color:#e6edff !important}
    body:not(.theme-light) .stationMeta,
    body:not(.theme-light) .mutedSm{color:#8ea3c6 !important}
    body:not(.theme-light) .stationAction{background:#0f1a31 !important;color:#e6edff !important;border-color:#334 !important}

    .stationClusters{display:grid;gap:12px;margin-top:10px}
    .stationCluster{border:1px solid #2a3a58;border-radius:12px;background:rgba(7,16,33,.55);padding:10px}
    .singletonClusterGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .stationCluster.singleton .stationGrid{grid-template-columns:1fr}
    .clusterHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .clusterTitle{font-size:13px;color:#bcd0f6;font-weight:700;letter-spacing:.3px}
    .clusterCount{font-size:12px;color:#8ea3c6;margin-left:auto}
    .clusterToggle{border:1px solid #334;background:#0f1a31;color:#bcd0f6;border-radius:10px;padding:3px;cursor:pointer;line-height:1;min-width:34px;min-height:29px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
    .clusterToggle:hover{border-color:#5b78a8;background:#152748}
    .clusterChevron{width:13px;height:13px;display:inline-block;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-2px;transition:transform .14s ease}
    .stationCluster.isCollapsed .clusterChevron{transform:rotate(-45deg);margin-top:0}
    body.theme-light .clusterToggle{background:#c0c9ee;color:#2f2a4f;border-color:rgba(137,138,196,.42)}
    body.theme-light .clusterToggle:hover{background:#d7def4;border-color:rgba(137,138,196,.56)}
    .stationCluster.isCollapsed .stationGrid{display:none}
    .stationCluster.isCollapsed .clusterHead{margin-bottom:0}
    .stationGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .stationCard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid #2a3a58;border-radius:10px;background:#0a1222;padding:8px;overflow:hidden}
    .stationCard.isActive{border-color:#22c55e;box-shadow:0 0 0 1px rgba(34,197,94,.25) inset}
    .stationName{font-size:14px;color:#e6edff;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stationMeta{font-size:11px;color:#8ea3c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
    .stationCard > div:nth-child(2){min-width:0}
    .stationControls{display:flex;align-items:center;gap:6px;flex:0 0 auto}
    .stationAction{border:1px solid #334;background:#0f1a31;color:#e6edff;border-radius:9px;padding:4px 10px;cursor:pointer;font-size:14px;line-height:1.1;min-width:36px;min-height:32px;touch-action:manipulation}
    .stationAction:hover{border-color:#5b78a8;background:#152748}
    .stationAction.isOn{border-color:#22c55e !important;color:#22c55e !important;background:rgba(34,197,94,.20) !important;box-shadow:0 0 0 1px rgba(34,197,94,.45) inset,0 0 12px rgba(34,197,94,.35)}
    .stationAction.isOn[data-add]{font-weight:800;text-shadow:0 0 8px rgba(34,197,94,.7)}
    .stationCard:has(.stationAction.isOn[data-add]){border-color:rgba(34,197,94,.9) !important;box-shadow:0 0 0 1px rgba(34,197,94,.45) inset,0 0 22px rgba(34,197,94,.28)}
    body.theme-light .stationAction.isOn{border-color:#16a34a !important;color:#166534 !important;background:rgba(22,163,74,.28) !important;box-shadow:0 0 0 1px rgba(22,163,74,.5) inset,0 0 10px rgba(22,163,74,.25)}
    body.theme-light .stationCard:has(.stationAction.isOn[data-add]){border-color:rgba(22,163,74,.75) !important;box-shadow:0 0 0 1px rgba(22,163,74,.34) inset,0 0 16px rgba(22,163,74,.18)}
    .chip{display:inline-block;border:1px solid #2a3a58;border-radius:999px;padding:1px 7px;font-size:10px;color:#9fb1d9;margin-left:4px}
    .chip.hq{border-color:rgba(251,191,36,.75);color:#fbbf24;background:rgba(251,191,36,.14);font-weight:700}
    .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(148,163,184,.35);border-top-color:#60a5fa;border-radius:999px;animation:rbspin .8s linear infinite;vertical-align:-2px;margin-right:6px}
    @keyframes rbspin{to{transform:rotate(360deg)}}

    @media (max-width:1024px){.radioGrid{grid-template-columns:1fr 1fr}.stationGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.singletonClusterGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  
    /* Unified token mapping (phase 1) */
    :root{
      --np-bg:var(--npb-bg,#0c1526);
      --np-rail-bg:var(--npb-rail-bg,#0b1426);
      --np-text:var(--npb-text,#e7eefc);
      --np-card-bg:var(--npb-card-bg,rgba(10,18,34,.45));
      --np-card-border:var(--npb-card-border,#2a3a58);
      --np-tab-bg:var(--npb-tab-bg,#0f1a31);
      --np-tab-text:var(--npb-tab-text,#e7eefc);
      --np-tab-border:var(--npb-tab-border,#2a3a58);
      --np-tab-hover:var(--npb-tab-hover-bg,#2f4f93);
      --np-tab-active-bg:var(--npb-tab-active-bg,#3357d6);
      --np-tab-active-text:var(--npb-tab-active-text,#ffffff);
    }
    html,body{background:var(--np-bg) !important;color:var(--np-text) !important;}
    .card,.cfgCard,.panel,.section,.subsShell,.stationCluster,.stationCard{background:var(--np-card-bg) !important;border-color:var(--np-card-border) !important;color:var(--np-text) !important;}
    .topTabs a{background:var(--np-tab-bg) !important;color:var(--np-tab-text) !important;border-color:var(--np-tab-border) !important;}
    .topTabs a:hover{background:var(--np-tab-hover) !important;}
    .topTabs a.active,.topTabs a[aria-current="page"]{background:var(--np-tab-active-bg) !important;color:var(--np-tab-active-text) !important;border-color:var(--np-tab-border) !important;}
    input,select,textarea,button,.stationAction,.clusterToggle{background:var(--np-tab-bg) !important;color:var(--np-tab-text) !important;border-color:var(--np-tab-border) !important;}
    input[type="checkbox"],
    input[type="radio"]{accent-color:var(--npb-progress-fill,var(--npb-tab-active-bg,#3357d6));}
    .btnPrimary,.primary{background:var(--np-tab-active-bg) !important;color:var(--np-tab-active-text) !important;border-color:var(--np-tab-border) !important;}
    button:hover,.stationAction:hover,.clusterToggle:hover{background:var(--np-tab-hover) !important;}
    .muted,.mutedSm,label,.stationMeta{color:var(--np-text) !important;opacity:.82;}
</style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="choiceLine" style="justify-content:space-between;gap:10px;">
        <strong>Global Directory (Radio Browser)</strong>
        <span class="muted">Search + preview + add to moOde</span>
      </div>
      <div class="radioGrid" style="margin-top:10px;grid-template-columns:1.3fr .8fr .8fr .8fr .8fr .9fr;">
        <label>Search name<br><input id="rbSearch" type="text" placeholder="jazz24, soma fm, bbc..." /></label>
        <label>Country code<br><input id="rbCountry" type="text" placeholder="US" /></label>
        <label>Tag / genre<br><input id="rbTag" type="text" placeholder="rock" /></label>
        <label>Codec<br><input id="rbCodec" type="text" placeholder="mp3" /></label>
        <label><input id="rbHqOnly" type="checkbox" /> HQ only</label>
        <label><input id="rbExcludeExisting" type="checkbox" checked /> Omit already in moOde</label>
      </div>
      <div style="margin-top:10px;border-top:1px dashed #2a3a58;padding-top:10px;">
        <div class="muted" style="margin-bottom:6px;">Manual stream URL</div>
        <div class="radioGrid" style="grid-template-columns:auto 2.4fr .9fr auto auto auto;align-items:end;">
          <div>
            <div class="muted" style="margin-bottom:6px;">Logo</div>
            <img id="rbManualLogo" class="logo" alt="" style="width:44px;height:44px;" src="" />
          </div>
          <label>Stream URL<br><input id="rbManualUrl" type="text" placeholder="https://example.com/stream" /></label>
          <label>Name (optional)<br><input id="rbManualName" type="text" placeholder="Auto-detect if empty" /></label>
          <label>&nbsp;<br><button id="rbManualPreview" class="stationAction">▶ Preview</button></label>
          <label>&nbsp;<br><button id="rbManualAdd" class="stationAction">＋ Add</button></label>
          <label>&nbsp;<br><button id="rbManualAddFav" class="stationAction">♥ Add favorite</button></label>
        </div>
      </div>

      <div id="rbStatus" class="muted" style="margin-top:8px;"></div>
      <div id="rbRows" class="stationClusters" style="margin-top:8px;"></div>
    </section>

    <section class="card">
      <div class="muted">Filter stations, assign favorites with ♥, and send selected stations to moOde queue.</div>

      <div class="radioGrid" style="margin-top:10px;">
        <label>Genre<br><select id="genre"></select></label>
        <label>Favorites dropdown<br><select id="favoritesPreset" multiple size="6"></select></label>
        <label>Load Presets<br><select id="loadPresets"><option value="">Select preset…</option></select></label>
        <label>Search station<br><input id="search" type="text" placeholder="station name" /></label>
        <label><input id="favoritesOnly" type="checkbox" /> Favorites only</label>
        <label><input id="hqOnly" type="checkbox" /> High quality only</label>
      </div>

      <div class="choiceLine" style="margin-top:10px; gap:8px;">
        <button id="refreshBtn">Refresh list</button>
        <button id="selectAllBtn">Select all shown</button>
        <button id="clearSelBtn">Clear selection</button>
        <label><input id="modeReplace" type="radio" name="modeRadioPage" value="replace" checked /> Replace queue</label>
        <label><input id="modeAppend" type="radio" name="modeRadioPage" value="append" /> Append</label>
        <label><input id="crop" type="checkbox" checked /> Crop queue</label>
        <button id="sendBtn" class="btnPrimary">Send selected to moOde</button>
      </div>

      <div id="status" class="muted" style="margin-top:8px"></div>
      <div id="count" class="mutedSm"></div>

      <div id="rows" class="stationClusters"></div>
    </section>

    <input id="apiBase" type="hidden" />
    <input id="key" type="hidden" />
  </div>

  <script src="scripts/theme-toggle.js?v=20260217-1"></script>
  <script src="scripts/radio.js?v=20260228-radiobrowser-iheartfix2"></script>
</body>
</html>
